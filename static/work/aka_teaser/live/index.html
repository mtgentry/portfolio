    <style>
      /* Local serif companion to Gloock — used for lighter footer copy. */
      @font-face {
        font-family: 'Signifier';
        font-weight: 300;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/TestSignifier-Light.otf') format('opentype');
      }
      /* Inter — used in the footer. Three weights from /public/fonts. */
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/Inter-Regular.woff') format('woff');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/Inter-SemiBold.woff') format('woff');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/Inter-Bold.woff') format('woff');
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body { overscroll-behavior-y: none; }
      body {
        width: 100vw;
        min-height: 100vh;
        overflow-x: hidden;
        background: #222222;
        font-family: 'Gloock', serif;
      }
      #info {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #00ff88;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        z-index: 100;
        pointer-events: none;
      }
      .label {
        color: #ffffff;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.8);
        padding: 8px 12px;
        border-radius: 4px;
        border-left: 3px solid #00ff88;
        max-width: 220px;
        pointer-events: none;
        white-space: normal;
      }
      .label-title {
        font-weight: bold;
        margin-bottom: 4px;
        color: #00ff88;
      }
      /* Preloader: 2px striped bar at the top of the viewport, using the
         same 10-color palette as the wire texture in src/group2/wireMaterial.js.
         Visible immediately on HTML load (no JS dependency); fades out
         once App.jsx finishes WebGPU init via `body.classList.add('ready')`. */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 2px;
        z-index: 9999;
        pointer-events: none;
        background: repeating-linear-gradient(
          90deg,
          #ed4259 0%,  #ed4259 10%,
          #26268c 10%, #26268c 20%,
          #d973a6 20%, #d973a6 30%,
          #4073d9 30%, #4073d9 40%,
          #8c4026 40%, #8c4026 50%,
          #f2ebd9 50%, #f2ebd9 60%,
          #bf8cbf 60%, #bf8cbf 70%,
          #a6bf59 70%, #a6bf59 80%,
          #408c40 80%, #408c40 90%,
          #b340b3 90%, #b340b3 100%
        );
        background-size: 200px 100%;
        animation: preloader-slide 4s linear infinite;
        opacity: 1;
        transition: opacity 0.5s ease-out 0.2s;
      }
      @keyframes preloader-slide {
        from { background-position: 0 0; }
        to   { background-position: 200px 0; }
      }
      body.ready #preloader {
        opacity: 0;
      }
      /* Fallback shown when WebGPU isn't available or a working device
         can't be acquired (Firefox, many Smart-TV / in-app webview
         browsers, iOS ≤ 18, virtualized GPUs, etc.). App.jsx adds
         `body.no-webgpu` when `navigator.gpu` is missing at load OR when
         the async adapter/device probe (detectWebGPU) fails OR from the gl
         factory's catch. When set, we hide the (uninitialized) canvas +
         scroll spacer and show this on-brand message. It still surfaces
         the email signup so non-WebGPU visitors aren't a dead end. */
      #fallback-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #FFFCF8;
        color: #242424;
        font-family: 'Gloock', serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        overflow-y: auto;
      }
      body.no-webgpu #fallback-message {
        display: flex;
      }
      body.no-webgpu #r3f-canvas,
      body.no-webgpu #info,
      body.no-webgpu #scroll-spacer {
        display: none;
      }
      .fallback-inner {
        max-width: 560px;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .fallback-wordmark {
        font-size: clamp(56px, 14vw, 120px);
        line-height: 1;
        letter-spacing: -0.01em;
        margin-bottom: 0.35em;
      }
      .fallback-inner .fallback-tagline {
        font-size: clamp(20px, 3.2vw, 30px);
        line-height: 1.3;
        max-width: 520px;
        margin: 0 auto;
      }
      #fallback-form {
        width: min(420px, calc(100vw - 48px));
        margin: 2rem auto 0;
      }
      .fallback-inner .fallback-note {
        font-size: clamp(13px, 1.8vw, 15px);
        line-height: 1.5;
        max-width: 460px;
        margin: 2.25rem auto 0;
        color: #8a857c;
      }
      .fallback-inner .fallback-note code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
      #r3f-canvas {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100vw !important;
        /* 100svh = small viewport height (FIXED to the smallest stable
           viewport size, i.e. when iOS Safari's URL bar is visible). The
           canvas never resizes as bars collapse/expand, so the scene
           doesn't scale/stutter mid-transition. When bars collapse the
           visible area exceeds the canvas — body bg (kept in sync with
           scene bg by BackgroundColor) fills that strip seamlessly. */
        height: 100svh !important;
        z-index: 1;
        /* Safari (WebKit) does not bubble wheel events from a fixed,
           pointer-interactive element to the document scroller — Chrome/Blink
           does. pointer-events:none lets the wheel fall through to the body so
           native scroll works in all browsers. Dev mode (App.jsx) re-enables
           pointer events on the canvas when OrbitControls or drag handles need
           them (showCameraDebug / showDevUI). */
        pointer-events: none;
      }
      /* R3F sets `touch-action: none` on both the wrapper div and the
         inner canvas. Browsers intersect touch-action down the ancestor
         chain, so overriding only the inner canvas does nothing — the
         wrapper's `none` still wins. Override both so vertical swipes
         scroll the document; horizontal + pinch remain available for R3F
         handlers. Mouse input is unaffected, so OrbitControls in dev
         mode still works via desktop mouse-drag. */
      #r3f-canvas,
      #r3f-canvas canvas {
        touch-action: pan-y !important;
      }
      #scroll-spacer {
        height: 650vh;
        position: relative;
        z-index: 50;
        pointer-events: none;
      }
      .hero-copy {
        position: relative;
        z-index: 50;
        margin-top: 100vh;
        padding: 14vh 1.5rem 18vh;
        background: #1a1a1a;
        color: #f0f0f0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Inter", Helvetica, Arial, sans-serif;
      }
      .hero-copy > * {
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
      }
      .hero-copy .opener {
        font-size: clamp(28px, 4.5vw, 52px);
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.015em;
        margin-bottom: 1.4em;
      }
      .hero-copy p {
        font-size: clamp(17px, 1.7vw, 21px);
        line-height: 1.6;
        margin-bottom: 1.4em;
        color: #c8c8c8;
      }
      .hero-copy .closer {
        font-size: clamp(20px, 2.1vw, 27px);
        font-weight: 500;
        color: #f5f5f5;
        line-height: 1.4;
        margin-top: 2.5em;
      }
      .v5-page {
        position: relative;
        z-index: 100;
        background: #0e0e10;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Inter", Helvetica, Arial, sans-serif;
      }
      .v5-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8vh 6vw;
        box-sizing: border-box;
      }
      .v5-section > * {
        max-width: 1200px;
        width: 100%;
        text-align: center;
      }
      .v5-opener {
        font-size: clamp(36px, 7vw, 96px);
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #ffffff;
      }
      .v5-body {
        font-size: clamp(20px, 3.4vw, 48px);
        line-height: 1.3;
        font-weight: 400;
        letter-spacing: -0.005em;
        color: #b8b8b8;
      }
      .v5-closer {
        font-size: clamp(26px, 4.3vw, 60px);
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: -0.015em;
        color: #ffffff;
      }
      /* Override beehiiv's default vertical padding (was 80px each) and
         center the input + button as a group inside the form. The form
         itself fills our 560px container, but its children (input,
         button) align at the left by default — flex with justify-center
         pulls them into the horizontal middle. */
      .beehiiv-subscribe-form {
        padding-top: 60px !important;
        padding-bottom: 60px !important;
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
        align-items: center !important;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-ou8Yc7Eo.js"></script>
  </head>
  <body>
    <div id="preloader"></div>
    <div id="fallback-message">
      <div class="fallback-inner">
        <div class="fallback-wordmark">aka</div>
        <p class="fallback-tagline">Your AI agents are running wild. AKA will bring control to the chaos.</p>
        <!-- beehiiv signup is injected here by App.jsx (showFallback) only

        <div id="fallback-form"></div>
        <p class="fallback-note">The interactive version of this page uses WebGPU. For the full experience, open it in a recent Chrome, Edge, or Safari&nbsp;18+ — or enable WebGPU in Firefox via <code>about:config → dom.webgpu.enabled</code>.</p>
      </div>
    </div>
    <div id="root"></div>
    <div id="scroll-spacer"></div>
  </body>
