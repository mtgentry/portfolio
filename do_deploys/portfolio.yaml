alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: masongentry.com
  type: PRIMARY
- domain: www.masongentry.com
  type: ALIAS
name: portfolio
region: sfo
static_sites:
- build_command: npm run generate
  environment_slug: node-js
  envs:
  - key: BASE_URL
    scope: BUILD_TIME
    value: https://masongentry.com
  - key: NODE_ENV
    scope: BUILD_TIME
    value: production
  github:
    branch: master
    deploy_on_push: true
    repo: mtgentry/portfolio
  name: portfolio
  output_dir: dist
  source_dir: /
