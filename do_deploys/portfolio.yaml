alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: masongentry.com
  type: PRIMARY
- domain: www.masongentry.com
  type: ALIAS
ingress:
  rules:
  - component:
      name: api
    match:
      path:
        prefix: /api
  - component:
      name: portfolio
    match:
      path:
        prefix: /
name: portfolio
region: sfo
static_sites:
- build_command: npm run generate
  environment_slug: node-js
  envs:
  - key: BASE_URL
    scope: BUILD_TIME
    value: https://masongentry.com
  - key: NODE_ENV
    scope: BUILD_TIME
    value: production
  github:
    branch: master
    deploy_on_push: true
    repo: mtgentry/portfolio
  name: portfolio
  output_dir: dist
  source_dir: /
functions:
- name: api
  source_dir: /functions
  github:
    branch: master
    deploy_on_push: true
    repo: mtgentry/portfolio
  envs:
  - key: BEEHIIV_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: YOUR_API_KEY
  - key: BEEHIIV_PUBLICATION_ID
    scope: RUN_AND_BUILD_TIME
    value: pub_431e94a8-c596-4ec4-afe1-7b1a1fd61aba
